name: Run scrape_and_merge.py every hour

on:
  schedule:
    - cron: '0 * * * *'   # Runs every hour at minute 0
  workflow_dispatch:       # Allows manual trigger from GitHub UI
  
permissions:
      contents: write     # Allows pushing back to repo
jobs:
  scrape:
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "No requirements.txt"; fi

      - name: Run scraper script
        run: python scrape_and_merge.py

      - name: Commit updated CSV if changed
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git add data/er_wait_times.csv
          git diff --cached --quiet || (git commit -m "Auto-update: ER wait & RSV data" && echo "Committed changes") || echo "No changes to commit"

      - name: Push changes back to repo
        run: |
         git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:Projects
